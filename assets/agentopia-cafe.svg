    </pattern>
    <pattern id="cafe-floor" width="104" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 0H104M0 46H104M51 0v46" fill="none" stroke="#a77a58" stroke-width="3" opacity=".38"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#eadfcb"/>
  <rect width="1200" height="348" fill="#e9dfce"/>
  <rect width="1200" height="348" fill="url(#cafe-bricks)"/>
